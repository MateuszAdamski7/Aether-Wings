<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="spaceGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a0845" />
      <stop offset="65%" stop-color="#110524" />
      <stop offset="100%" stop-color="#07020d" />
    </radialGradient>

    <!-- Synthwave Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="35%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#7900ff" />
    </linearGradient>

    <!-- Neon Cyan & Magenta Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#5bfaff" />
    </linearGradient>

    <linearGradient id="neonMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#ff55a3" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowMagenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Sun Mask for Retro Horizontal Stripes -->
    <mask id="sunStripes">
      <!-- Full white circle -->
      <circle cx="64" cy="56" r="32" fill="#fff" />
      <!-- Black horizontal bars that slice the bottom half of the sun -->
      <rect x="25" y="56" width="78" height="2" fill="#000" />
      <rect x="25" y="62" width="78" height="3" fill="#000" />
      <rect x="25" y="69" width="78" height="4.5" fill="#000" />
      <rect x="25" y="77" width="78" height="6.5" fill="#000" />
      <rect x="25" y="86" width="78" height="8" fill="#000" />
    </mask>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="128" height="128" rx="28" fill="url(#spaceGlow)" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#ff007f" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Retro Grid Floor (Subtle Horizon) -->
  <g opacity="0.35" stroke="#00f3ff" stroke-width="0.8">
    <line x1="16" y1="90" x2="112" y2="90" />
    <line x1="12" y1="100" x2="116" y2="100" />
    <line x1="8" y1="112" x2="120" y2="112" />
    <!-- Perspective lines converging to center horizon (64, 85) -->
    <line x1="64" y1="85" x2="64" y2="120" />
    <line x1="64" y1="85" x2="40" y2="120" />
    <line x1="64" y1="85" x2="88" y2="120" />
    <line x1="64" y1="85" x2="18" y2="120" />
    <line x1="64" y1="85" x2="110" y2="120" />
  </g>

  <!-- Synthwave Segmented Sun -->
  <circle cx="64" cy="56" r="32" fill="url(#sunGrad)" mask="url(#sunStripes)" opacity="0.9" />

  <!-- Background Stars / Sparkles -->
  <circle cx="28" cy="28" r="1.2" fill="#00f3ff" opacity="0.8" />
  <circle cx="100" cy="24" r="1.5" fill="#ffe600" opacity="0.9" />
  <circle cx="94" cy="46" r="1.0" fill="#ff007f" opacity="0.7" />
  <circle cx="20" cy="60" r="1.0" fill="#ffffff" opacity="0.6" />

  <!-- Thruster Trail / Plumes -->
  <path d="M57,86 L57,112 L60,86 Z" fill="#00f3ff" opacity="0.9" filter="url(#glowCyan)" />
  <path d="M71,86 L71,112 L68,86 Z" fill="#00f3ff" opacity="0.9" filter="url(#glowCyan)" />
  <path d="M62,86 L64,118 L66,86 Z" fill="#ff007f" opacity="0.85" filter="url(#glowMagenta)" />

  <!-- Aether Wings Starfighter Geometry -->
  <g filter="url(#glowCyan)">
    <!-- Main Swept Wings -->
    <polygon points="64,18 73,56 108,76 86,76 74,86 64,74 54,86 42,76 20,76 55,56" 
             fill="#0c041f" 
             stroke="#00f3ff" 
             stroke-width="2.5" 
             stroke-linejoin="round" />

    <!-- Inner Neon Accents (Magenta Wing Edge Trims) -->
    <polyline points="24,74 44,74 56,84" fill="none" stroke="#ff007f" stroke-width="2" stroke-linecap="round" />
    <polyline points="104,74 84,74 72,84" fill="none" stroke="#ff007f" stroke-width="2" stroke-linecap="round" />

    <!-- Center Fuselage Spine & Nosecone -->
    <polygon points="64,18 71,56 68,86 64,88 60,86 57,56" 
             fill="#170638" 
             stroke="#ff007f" 
             stroke-width="1.8" 
             stroke-linejoin="round" />

    <!-- Cockpit Canopy -->
    <ellipse cx="64" cy="50" rx="3.5" ry="11" fill="#00f3ff" />
    <ellipse cx="64" cy="47" rx="1.8" ry="6" fill="#ffffff" opacity="0.9" />

    <!-- Twin Engine Pods -->
    <rect x="55" y="80" width="4" height="6" rx="1.5" fill="#00f3ff" />
    <rect x="69" y="80" width="4" height="6" rx="1.5" fill="#00f3ff" />
  </g>
</svg>